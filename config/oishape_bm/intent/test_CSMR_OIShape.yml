DATA_PRESET:
  CENTER_IDX: 9
  USE_CACHE: True
  N_RESAMPLED_OBJ_POINTS: 4096
  N_INTENTS: 2

DATASET:
  TRAIN:
    TYPE: OIShape
    DATA_SPLIT: train
    DATA_ROOT: ./data
    DATA_MODE: intent
    OBJ_CATES: ["trigger_sprayer"]
    INTENT_MODE: ["use", "hold"]
    
  VAL:
    TYPE: OIShape
    DATA_SPLIT: val
    DATA_ROOT: ./data
    DATA_MODE: intent
    OBJ_CATES: ["trigger_sprayer"]
    INTENT_MODE: ["use", "hold"]

  TEST:
    TYPE: OIShape
    DATA_SPLIT: test
    DATA_ROOT: ./data
    DATA_MODE: intent
    OBJ_CATES: ["trigger_sprayer","bottle",'cylinder_bottle','cameras','lotion_pump','gamecontroller','pen','eyeglasses','mug']
    INTENT_MODE: ["use", "hold"]


TRANSFORM:
  TYPE: GrabNetTransformIntent
  RAND_ROT: True
  RAND_DEG_STD: 20
  USE_ORIGINAL_OBJ_ROT: False
  BPS_BASIS_PATH: assets/GrabNet/bps.npz
  BPS_FEAT_TYPE: dists

MODEL:
  TYPE: GrabNet
  COARSE_NET:
    TYPE: CoarseIntentNetCS
    LATENTD: 16
    KL_COEF: 0.005
    VPE_PATH: "assets/GrabNet/verts_per_edge.npy"
    C_WEIGHT_PATH: "assets/GrabNet/rhand_weight.npy"
    PRETRAINED: checkpoints/csmr/grab_lsp3_2025_0906_1303_10/checkpoint_970/CoarseIntentNetIntentEmbedEncode.pth.tar


  REFINE_NET:
    TYPE: RefineNetMsRN
    KL_COEF: 0.005
    VPE_PATH: "assets/GrabNet/verts_per_edge.npy"
    C_WEIGHT_PATH: "assets/GrabNet/rhand_weight.npy"
    PRETRAINED: checkpoints/csmr/ragg14_2025_0902_1227_16/checkpoint_200/RefineNet.pth.tar
